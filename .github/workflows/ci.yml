---
name: ci

on: [pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: guides
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruby/rubygems
          path: rubygems
          ref: "4.0"
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: 4.0
          bundler-cache: true
          working-directory: guides

      - name: Build jekyll
        run: bundle exec jekyll build
        working-directory: guides

      - name: Build search index
        run: npx --yes pagefind@1.5.2 --site _site
        working-directory: guides

      - name: Generate command references
        run: RUBYOPT="--disable-gems -I../rubygems/lib" RUBYGEMS_DIR="../rubygems" bundle exec rake command_reference && git diff --exit-code
        working-directory: guides

      - name: Lint generated markdown
        run: bundle exec mdl --rules MD009,MD012 command-reference.md
        working-directory: guides
